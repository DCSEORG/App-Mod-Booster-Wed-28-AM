<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Management - Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #667eea;
            font-size: 1.8em;
            margin: 0;
        }

        .back-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        .chat-container {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 15px;
            line-height: 1.5;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #f8f9fa;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 5px;
        }

        .message.error {
            align-self: center;
            background: #ffe5e5;
            color: #d32f2f;
            border: 1px solid #ffcdd2;
            max-width: 90%;
        }

        .message.assistant strong {
            color: #667eea;
        }

        .message.assistant ol,
        .message.assistant ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .message.assistant li {
            margin: 5px 0;
        }

        .loading {
            align-self: flex-start;
            display: flex;
            gap: 8px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-bottom-left-radius: 5px;
        }

        .loading span {
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-container {
            padding: 20px 30px;
            background: white;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
        }

        #messageInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendBtn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: transform 0.3s, opacity 0.3s;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .welcome-message h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .suggestion-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .suggestion-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💬 Expense Management Chat Assistant</h1>
            <a href="/Index" class="back-btn">← Back to Dashboard</a>
        </header>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="welcome-message">
                    <h2>👋 Hello! I'm your Expense Assistant</h2>
                    <p>I can help you manage expenses, view reports, and answer questions about the expense management system.</p>
                    <div class="suggestions">
                        <button class="suggestion-btn" onclick="sendSuggestion('Show me all submitted expenses')">Show submitted expenses</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('List all users')">List all users</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('What categories are available?')">View categories</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Show me approved expenses')">Show approved expenses</button>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Ask me anything about expenses..." />
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Allow Enter key to send message
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });

        function sendSuggestion(text) {
            messageInput.value = text;
            sendMessage();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function formatMessage(text) {
            // First escape HTML to prevent XSS
            let formatted = escapeHtml(text);
            
            // Convert markdown-style formatting to HTML
            // Bold text: **text** -> <strong>text</strong>
            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            
            // Handle numbered lists
            const lines = formatted.split('\n');
            let inOrderedList = false;
            let inUnorderedList = false;
            let result = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Numbered list item
                if (/^\d+\.\s/.test(line)) {
                    if (!inOrderedList) {
                        if (inUnorderedList) {
                            result.push('</ul>');
                            inUnorderedList = false;
                        }
                        result.push('<ol>');
                        inOrderedList = true;
                    }
                    result.push('<li>' + line.replace(/^\d+\.\s/, '') + '</li>');
                }
                // Bullet list item
                else if (/^[-*]\s/.test(line)) {
                    if (!inUnorderedList) {
                        if (inOrderedList) {
                            result.push('</ol>');
                            inOrderedList = false;
                        }
                        result.push('<ul>');
                        inUnorderedList = true;
                    }
                    result.push('<li>' + line.replace(/^[-*]\s/, '') + '</li>');
                }
                // Regular line
                else {
                    if (inOrderedList) {
                        result.push('</ol>');
                        inOrderedList = false;
                    }
                    if (inUnorderedList) {
                        result.push('</ul>');
                        inUnorderedList = false;
                    }
                    if (line) {
                        result.push(line + '<br>');
                    }
                }
            }
            
            // Close any open lists
            if (inOrderedList) result.push('</ol>');
            if (inUnorderedList) result.push('</ul>');
            
            return result.join('\n');
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            if (type === 'assistant') {
                messageDiv.innerHTML = formatMessage(text);
            } else {
                messageDiv.textContent = text;
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.id = 'loading';
            loadingDiv.innerHTML = '<span></span><span></span><span></span>';
            messagesContainer.appendChild(loadingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.remove();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Remove welcome message if present
            const welcome = document.querySelector('.welcome-message');
            if (welcome) welcome.remove();

            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            
            // Disable input while processing
            sendBtn.disabled = true;
            messageInput.disabled = true;
            showLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                hideLoading();

                if (data.success) {
                    addMessage(data.response, 'assistant');
                } else {
                    addMessage(data.response || 'Sorry, I encountered an error. Please try again.', 'error');
                }
            } catch (error) {
                hideLoading();
                addMessage('Sorry, I could not connect to the server. Please check that the application is running and try again.', 'error');
                console.error('Error:', error);
            } finally {
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }
    </script>
</body>
</html>
